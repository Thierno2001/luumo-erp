services:
  web:
    image: odoo:18.0
    container_name: luumo_odoo_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    entrypoint: ["/bin/bash", "/usr/local/bin/luumo-entrypoint.sh"]
    command: ["odoo"]
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - LUUMO_DB_NAME=${LUUMO_DB_NAME:-luumo}
      - LUUMO_AUTO_INIT=${LUUMO_AUTO_INIT:-1}
      - LUUMO_AUTO_UPGRADE=${LUUMO_AUTO_UPGRADE:-0}
      # Passerelle Mobile Money / QR Code B2B (Orange Money / MTN MoMo / Djomi / PayCard)
      - LUUMO_GATEWAY_PROVIDER=${LUUMO_GATEWAY_PROVIDER:-djomi}
      - LUUMO_MERCHANT_ID=${LUUMO_MERCHANT_ID:-620145}
      - LUUMO_GATEWAY_API_URL=${LUUMO_GATEWAY_API_URL:-}
      - LUUMO_API_SECRET=${LUUMO_API_SECRET:-}
      - LUUMO_WEBHOOK_SECRET=${LUUMO_WEBHOOK_SECRET:-luumo-default-hmac-secret-change-in-prod}
      - LUUMO_PUBLIC_BASE_URL=${LUUMO_PUBLIC_BASE_URL:-}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ./custom_addons:/mnt/extra-addons:ro
      - ./scripts/entrypoint-backend.sh:/usr/local/bin/luumo-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8069/api/luumo/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - luumo_internal_net
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: luumo_postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      # Exposé uniquement en local (127.0.0.1) pour ne jamais exposer PostgreSQL sur Internet
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - luumo_internal_net
    restart: unless-stopped

networks:
  luumo_internal_net:
    driver: bridge

volumes:
  odoo-web-data:
  odoo-db-data:
