[options]
; Chemins des modules (socle + modules métier Luumo)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Connexion PostgreSQL (conteneur "db")
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = luumo
db_maxconn = 64

; Sécurité & Isolation (OWASP A05 : Security Misconfiguration)
admin_passwd = luumo_admin_master_secret_change_in_prod
dbfilter = ^luumo$
list_db = False
proxy_mode = True

; Performances & Tolérance aux pannes
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
